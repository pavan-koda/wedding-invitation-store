<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel – WeddingInvitation.Store</title>
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a16;
            color: #e0e0f0;
            min-height: 100vh;
        }

        /* ========= LOGIN ========= */
        #loginWrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top right, #1a0a2e 0%, #0a0a16 100%);
            position: relative;
            overflow: hidden;
        }

        /* Decorative background elements */
        #loginWrap::before {
            content: '';
            position: absolute;
            top: -10%; right: -10%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(233,30,99,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        
        #loginWrap::after {
            content: '';
            position: absolute;
            bottom: -10%; left: -10%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(100,181,246,0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-card {
            background: rgba(22, 22, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .login-card .logo-emoji { 
            font-size: 42px; 
            margin-bottom: 12px; 
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(233,30,99,0.4));
            animation: floatEmoji 3s ease-in-out infinite;
        }

        @keyframes floatEmoji {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-card .sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 32px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 16px;
            transition: color 0.3s;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        .input-wrap input:focus {
            outline: none;
            border-color: #e91e63;
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 4px rgba(233,30,99,0.1);
        }

        .input-wrap:focus-within i {
            color: #e91e63;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        .btn-login:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }

        .login-error {
            background: rgba(244,67,54,0.1);
            color: #ff8a80;
            font-size: 13px;
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(244,67,54,0.2);
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-card h2 { font-size: 20px; }
        }

        /* ========= ADMIN WRAP ========= */
        #adminWrap { display: none; min-height: 100vh; }

        .topbar {
            background: #10101e;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 24px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-logo {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }

        .topbar-logo span {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-pill {
            background: rgba(233,30,99,0.15);
            border: 1px solid rgba(233,30,99,0.3);
            color: #e91e63;
            font-size: 10px;
            padding: 3px 9px;
            border-radius: 20px;
            font-weight: 600;
        }

        .topbar-right { display: flex; align-items: center; gap: 10px; }

        .btn-back-site, .btn-logout {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-back-site {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
        }

        .btn-back-site:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .btn-logout {
            background: rgba(244,67,54,0.1);
            border: 1px solid rgba(244,67,54,0.2);
            color: #f44336;
        }

        .btn-logout:hover { background: rgba(244,67,54,0.2); }

        /* ========= MAIN LAYOUT ========= */
        .admin-main {
            max-width: 1160px;
            margin: 0 auto;
            padding: 28px 20px 60px;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 22px;
            align-items: start;
        }

        @media (max-width: 800px) {
            .admin-main { grid-template-columns: 1fr; }
        }

        /* ========= CARDS ========= */
        .acard {
            background: #16162a;
            border-radius: 18px;
            padding: 26px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .acard-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .acard-title i { color: #e91e63; }

        .acard-title .count {
            font-size: 12px;
            color: #555;
            font-weight: 400;
            margin-left: auto;
        }

        /* ========= FORM ========= */
        .fgroup { margin-bottom: 14px; }

        .fgroup label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .req { color: #e91e63; }

        .fgroup input,
        .fgroup textarea,
        .fgroup select {
            width: 100%;
            padding: 11px 14px;
            background: #0a0a16;
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.2s;
        }

        .fgroup input:focus,
        .fgroup textarea:focus,
        .fgroup select:focus {
            outline: none;
            border-color: #e91e63;
        }

        .fgroup textarea { resize: vertical; min-height: 72px; }

        .fgroup select option { background: #16162a; }

        .frow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .fcheck {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .fcheck input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e91e63;
            cursor: pointer;
        }

        .fcheck label {
            font-size: 13px;
            color: #bbb;
            cursor: pointer;
        }

        .factions { display: flex; gap: 10px; }

        .btn-save {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn-save:hover { opacity: 0.9; }

        .btn-cancel {
            padding: 12px 18px;
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #bbb;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
            display: none;
        }

        .btn-cancel:hover { border-color: rgba(255,255,255,0.3); color: #fff; }

        /* ========= STATS BAR ========= */
        .stats-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .spill {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .spill.active   { background: rgba(76,175,80,0.15);  color: #4caf50; border: 1px solid rgba(76,175,80,0.25); }
        .spill.inactive { background: rgba(255,152,0,0.12);  color: #ff9800; border: 1px solid rgba(255,152,0,0.22); }
        .spill.expired  { background: rgba(244,67,54,0.12);  color: #f44336; border: 1px solid rgba(244,67,54,0.22); }

        /* ========= OFFER ITEMS ========= */
        .offer-item {
            background: #0e0e20;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 13px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .offer-item.active  { border-left: 3px solid #4caf50; }
        .offer-item.inactive { border-left: 3px solid #ff9800; }
        .offer-item.expired { border-left: 3px solid #f44336; opacity: 0.65; }

        .oi-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .oi-head-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .oi-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            color: #fff;
        }

        .oi-title { font-size: 14px; font-weight: 600; color: #fff; }

        .oi-status {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .oi-desc { font-size: 12px; color: #777; margin-bottom: 8px; line-height: 1.5; }

        .oi-meta {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 11px;
            color: #555;
            margin-bottom: 12px;
        }

        .oi-meta i { margin-right: 3px; }

        .oi-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .ba-edit, .ba-toggle, .ba-delete {
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .ba-edit {
            background: rgba(100,181,246,0.1);
            border-color: rgba(100,181,246,0.2);
            color: #64b5f6;
        }
        .ba-edit:hover { background: rgba(100,181,246,0.2); }

        .ba-toggle.activate {
            background: rgba(76,175,80,0.1);
            border-color: rgba(76,175,80,0.2);
            color: #4caf50;
        }
        .ba-toggle.activate:hover { background: rgba(76,175,80,0.2); }

        .ba-toggle.deactivate {
            background: rgba(255,152,0,0.1);
            border-color: rgba(255,152,0,0.2);
            color: #ff9800;
        }
        .ba-toggle.deactivate:hover { background: rgba(255,152,0,0.2); }

        .ba-delete {
            background: rgba(244,67,54,0.1);
            border-color: rgba(244,67,54,0.2);
            color: #f44336;
        }
        .ba-delete:hover { background: rgba(244,67,54,0.2); }

        .empty-state {
            text-align: center;
            padding: 44px 20px;
            color: #444;
        }

        .empty-state i { font-size: 38px; display: block; margin-bottom: 14px; }
        .empty-state p { font-size: 14px; line-height: 1.7; }

        /* ========= TOAST ========= */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a1a2e;
            border: 1px solid rgba(76,175,80,0.35);
            color: #4caf50;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 9999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 320px;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.err  { border-color: rgba(244,67,54,0.35); color: #f44336; }

        /* ========= THEME DOTS ========= */
        .theme-preview {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .tdot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .tdot:hover { transform: scale(1.2); }
    </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginWrap">
    <div class="login-card">
        <span class="logo-emoji">🛡️</span>
        <h2>Admin Panel</h2>
        <p class="sub">WeddingInvitation.Store</p>
        <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
        </div>
        <button class="btn-login" onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
        <p class="login-error" id="loginError">Incorrect password. Try again.</p>
    </div>
</div>

<!-- ===== ADMIN DASHBOARD ===== -->
<div id="adminWrap">

    <div class="topbar">
        <div class="topbar-left">
            <span class="topbar-logo">Wedding<span>Invitation</span>.Store</span>
            <span class="admin-pill">Admin</span>
        </div>
        <div class="topbar-right">
            <a href="index.html" class="btn-back-site">
                <i class="fa-solid fa-arrow-left"></i> Back to Site
            </a>
            <button class="btn-logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <div class="admin-main">

        <!-- ---- ANALYTICS DASHBOARD ---- -->
        <div style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 0;">
            <!-- Total -->
            <div class="acard" style="background: linear-gradient(135deg, #16162a 0%, #1a1a35 100%);">
                <h3 style="font-size:14px; color:#aaa; margin-bottom:5px;"><i class="fa-solid fa-globe"></i> Total Visits</h3>
                <div style="font-size: 32px; font-weight: 700; color: #fff;" id="totalVisits">...</div>
            </div>
            <!-- This Month -->
            <div class="acard">
                <h3 style="font-size:14px; color:#aaa; margin-bottom:5px;"><i class="fa-regular fa-calendar"></i> This Month</h3>
                <div style="font-size: 32px; font-weight: 700; color: #e91e63;" id="monthVisits">...</div>
            </div>
            <!-- Today -->
            <div class="acard">
                <h3 style="font-size:14px; color:#aaa; margin-bottom:5px;"><i class="fa-solid fa-clock"></i> Today</h3>
                <div style="font-size: 32px; font-weight: 700; color: #4caf50;" id="todayVisits">...</div>
            </div>
        </div>

    </div>
</div>

<script>
    const ADMIN_PASSWORD = 'admin123';

    const loginWrap  = document.getElementById('loginWrap');
    const adminWrap  = document.getElementById('adminWrap');

    /* ---- LOGIN ---- */
    function login() {
        const pwd = document.getElementById('password').value;
        const err = document.getElementById('loginError');
        if (pwd === ADMIN_PASSWORD) {
            loginWrap.style.display = 'none';
            adminWrap.style.display = 'block';
            loadStats();
        } else {
            err.style.display = 'block';
        }
    }

    function logout() { location.reload(); }

    document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });

    /* ---- STATS (API) ---- */
    async function loadStats() {
        const NAMESPACE = 'wedding-invitation-store';
        const now = new Date();
        const todayKey = now.toISOString().split('T')[0];
        const monthKey = todayKey.slice(0, 7);

        const getCount = async (key) => {
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/${key}/`);
                if (!res.ok) return 0;
                const data = await res.json();
                return data.count;
            } catch (e) { return 0; }
        };

        const [total, month, today] = await Promise.all([ getCount('visits'), getCount(`month_${monthKey}`), getCount(`date_${todayKey}`) ]);
        document.getElementById('totalVisits').textContent = total;
        document.getElementById('monthVisits').textContent = month;
        document.getElementById('todayVisits').textContent = today;
    }

    /* ---- INIT ---- */
</script>
</body>
</html>
